<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="1" stop-color="#E3EAF8" />
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A82FF" />
      <stop offset="1" stop-color="#2C63E8" />
    </linearGradient>
    <filter id="bgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2A4374" flood-opacity="0.18" />
    </filter>
    <filter id="winShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A4374" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="88" y="88" width="848" height="848" rx="190" fill="url(#bg)" filter="url(#bgShadow)" />
  <rect x="88" y="88" width="848" height="848" rx="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="6" />

  <!-- 后层窗口 -->
  <g filter="url(#winShadow)">
    <rect x="236" y="286" width="380" height="300" rx="32" fill="#E4EAF4" stroke="#B4BFD0" stroke-width="18" />
  </g>
  <circle cx="292" cy="338" r="10" fill="#B4BFD0" />
  <circle cx="324" cy="338" r="10" fill="#B4BFD0" />
  <circle cx="356" cy="338" r="10" fill="#B4BFD0" />
  <rect x="286" y="392" width="214" height="16" rx="8" fill="#CBD4E2" />
  <rect x="286" y="428" width="140" height="16" rx="8" fill="#CBD4E2" />

  <!-- 中层窗口（白色描边制造层间间隙） -->
  <rect x="322" y="372" width="380" height="300" rx="32" fill="none" stroke="#F7F9FF" stroke-width="34" />
  <g filter="url(#winShadow)">
    <rect x="322" y="372" width="380" height="300" rx="32" fill="#F2F5FB" stroke="#9EAABC" stroke-width="20" />
  </g>
  <circle cx="378" cy="424" r="10" fill="#9EAABC" />
  <circle cx="410" cy="424" r="10" fill="#9EAABC" />
  <circle cx="442" cy="424" r="10" fill="#9EAABC" />
  <rect x="372" y="478" width="214" height="16" rx="8" fill="#C4CEDD" />
  <rect x="372" y="514" width="140" height="16" rx="8" fill="#C4CEDD" />

  <!-- 前层窗口：主色高亮 -->
  <rect x="408" y="458" width="380" height="300" rx="32" fill="none" stroke="#F7F9FF" stroke-width="34" />
  <g filter="url(#winShadow)">
    <rect x="408" y="458" width="380" height="300" rx="32" fill="url(#front)" />
  </g>
  <path d="M408 520 H788" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" />
  <circle cx="464" cy="510" r="10" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="496" cy="510" r="10" fill="#FFFFFF" fill-opacity="0.65" />
  <circle cx="528" cy="510" r="10" fill="#FFFFFF" fill-opacity="0.45" />
  <rect x="458" y="566" width="214" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.55" />
  <rect x="458" y="604" width="140" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.34" />
</svg>
